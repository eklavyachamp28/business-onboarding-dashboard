server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular router: unknown paths fall back to the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API so the browser never needs CORS in the container setup
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
    }
}
