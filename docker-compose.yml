services:
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
